name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # pinned (not ubuntu-latest) so an OS switch can't silently change the Chrome the tests run on
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build
        run: node build.mjs
      - name: Committed dist/ matches the sources
        run: git diff --exit-code -- dist/
      - name: Static checks
        run: node tests/static-check.mjs
      - name: Test (headless Chrome)
        run: node tests/run.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
          CHROME_FLAGS: --no-sandbox

  # Publishes dist/cratechanger.html to GitHub Pages - only from main, and only after every test passed.
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare site (the app becomes index.html)
        run: mkdir -p _site && cp dist/cratechanger.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
